pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
 include /etc/nginx/mime.types;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 fastcgi_temp_path /tmp/fastcgi_temp;
 uwsgi_temp_path /tmp/uwsgi_temp;
 scgi_temp_path /tmp/scgi_temp;
 resolver 127.0.0.11 valid=5s ipv6=off;
 server_tokens off;
 limit_req_zone $binary_remote_addr zone=api:10m rate=15r/s;
 server {
  listen 8080;
  root /usr/share/nginx/html;
  client_max_body_size 16k;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' http://localhost:8180; frame-src http://localhost:8180; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' http://localhost:8180" always;
  location /api/accounts { limit_req zone=api burst=40 nodelay; limit_req_status 429; set $ledger_upstream http://ledger:8080; proxy_pass $ledger_upstream; proxy_set_header X-Request-ID $request_id; proxy_read_timeout 15s; }
  location /api/audit { limit_req zone=api burst=40 nodelay; limit_req_status 429; set $audit_upstream http://audit:8080; proxy_pass $audit_upstream; proxy_read_timeout 15s; }
  location /health { access_log off; return 200 'ok'; }
  location / { try_files $uri $uri/ /index.html; }
 }
}
